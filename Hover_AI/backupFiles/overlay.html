<!DOCTYPE html>
<html>

<head>

    <link rel="stylesheet" href="overlay.css">

</head>

<body>

    <!-- Floating Control Bar -->
    <div id="controlBar">

        <div id="dragHandle">
            <span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span>
        </div>

        <div id="statusDot"></div>

        <input
            id="goalInput"
            type="text"
            placeholder="What would you like HoverAI to help you with?"
        >
        
        <p id="goalError"></p>

        <button id="actionButton">
            <span class="btn-label">Start</span>
            <span class="btn-arrow">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 7H11M11 7L7.5 3.5M11 7L7.5 10.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </button>

    </div>

    <!-- Existing Pointer: gradient cursor-arrow -->
    <div id="pointer">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="cursorStroke" x1="4" y1="2" x2="34" y2="36" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#4f7cff"/>
                    <stop offset="35%" stop-color="#a855f7"/>
                    <stop offset="70%" stop-color="#ec4899"/>
                    <stop offset="100%" stop-color="#fb7185"/>
                </linearGradient>
                <linearGradient id="cursorFill" x1="6" y1="4" x2="30" y2="32" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#dfe6ff" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#fbd9e8" stop-opacity="0.85"/>
                </linearGradient>
            </defs>
            <path
                d="M8 4 L33 22 L21 24 L27 34 L21 37 L15 27 L8 34 Z"
                fill="url(#cursorFill)"
                stroke="url(#cursorStroke)"
                stroke-width="4.5"
                stroke-linejoin="round"
                stroke-linecap="round"
            />
        </svg>
    </div>

    <!-- Existing Tooltip -->
    <div id="tooltip"></div>

    <script type="module" src="overlay.js"></script>

</body>

</html>
